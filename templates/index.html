<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Teaching Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
<div class="chat-container">

    <!-- HEADER -->
    <header class="chat-header">
        <div>
            <h1>🤖 AI Teaching Assistant</h1>
            <p>Machine Learning & Deep Learning Tutor</p>
        </div>
        <div class="header-actions">
            <button class="new-chat-btn" id="newChatBtn" onclick="newChat()"
                    title="Start a new conversation" aria-label="Start a new conversation">
                New Chat
            </button>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙 / ☀️</button>
        </div>
    </header>

    <!-- CHAT -->
    <main class="chat-messages" id="chatMessages">
        <div class="example-questions">
            <p>Suggested Questions</p>
            <span onclick="askQuestion('What is overfitting in machine learning?')">What is overfitting?</span>
            <span onclick="askQuestion('How do CNNs work?')">How do CNNs work?</span>
            <span onclick="askQuestion('What is gradient descent?')">What is gradient descent?</span>
            <span onclick="askQuestion('Explain backpropagation')">Explain backpropagation</span>
            <span onclick="askQuestion('What are RNNs?')">What are RNNs?</span>
            <span onclick="askQuestion('What is an LSTM?')">What is an LSTM?</span>
        </div>
    </main>

    <!-- TYPING INDICATOR + STOP -->
    <div class="typing-indicator" id="typingIndicator">
        <span></span><span></span><span></span>
        <button class="stop-btn" id="stopBtn" onclick="stopGeneration()" aria-label="Stop generating">■ Stop</button>
    </div>

    <!-- INPUT -->
    <footer class="chat-input-container">
        <input
            id="userInput"
            class="chat-input"
            placeholder="Ask about ML/DL concepts..."
            onkeypress="handleKeyPress(event)"
        >
        <button class="send-button" onclick="sendMessage()" aria-label="Send message">Send</button>
    </footer>

</div>

<script>
const chatMessages    = document.getElementById("chatMessages");
const userInput       = document.getElementById("userInput");
const typingIndicator = document.getElementById("typingIndicator");

/* =====================
   STOP GENERATION
===================== */
let _activeReader = null;
const stopBtn = document.getElementById("stopBtn");

function stopGeneration() {
    if (_activeReader) {
        _activeReader.cancel();
        _activeReader = null;
    }
    stopBtn.classList.remove("visible");
}

/* =====================
   CONVERSATION HISTORY
   Kept client-side; sent with every request so the server can inject
   the last N turns into the LLM prompt for follow-up questions.
===================== */
let conversationHistory = [];   // [{role:"user"|"assistant", content:"..."}]
const MAX_HISTORY = 3;          // turns to keep (each turn = 1 user + 1 assistant)

function newChat() {
    conversationHistory = [];
    chatMessages.innerHTML = `
    <div class="example-questions">
        <p>Suggested Questions</p>
        <span onclick="askQuestion('What is overfitting in machine learning?')">What is overfitting?</span>
        <span onclick="askQuestion('How do CNNs work?')">How do CNNs work?</span>
        <span onclick="askQuestion('What is gradient descent?')">What is gradient descent?</span>
        <span onclick="askQuestion('Explain backpropagation')">Explain backpropagation</span>
        <span onclick="askQuestion('What are RNNs?')">What are RNNs?</span>
        <span onclick="askQuestion('What is an LSTM?')">What is an LSTM?</span>
    </div>`;
    userInput.focus();
}

/* =====================
   SCROLL MANAGEMENT
   - _autoScroll: true while user is at/near the bottom
   - _rafPending: ensures we fire at most one scroll per animation frame
     so we never trigger more than 60 layout reflows/s (vs one per token)
===================== */
let _autoScroll = true;
let _rafPending = false;

chatMessages.addEventListener("scroll", () => {
    const distFromBottom =
        chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
    // Re-enable auto-scroll if user scrolls back to within 80px of the bottom
    _autoScroll = distFromBottom < 80;
}, { passive: true });

function scrollToBottom() {
    if (!_autoScroll || _rafPending) return;
    _rafPending = true;
    requestAnimationFrame(() => {
        _rafPending = false;
        if (_autoScroll) chatMessages.scrollTop = chatMessages.scrollHeight;
    });
}

/* =====================
   THEME (PERSISTENT)
===================== */
function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
    html.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
}
(function initTheme() {
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
})();

/* =====================
   INPUT HANDLING
===================== */
function handleKeyPress(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function askQuestion(q) { userInput.value = q; sendMessage(); }

/* =====================
   USER MESSAGE
===================== */
function addUserMessage(text) {
    const msg    = document.createElement("div");
    msg.className = "message";
    const bubble = document.createElement("div");
    bubble.className = "user-message";
    bubble.textContent = text;
    msg.appendChild(bubble);
    chatMessages.appendChild(msg);
    scrollToBottom();
}

/* =====================
   FORMAT TEXT
===================== */
function formatExplanation(text) {
    let cleaned = text
        .replace(/📘\s*\*\*From.*?\*\*:/gi, "")
        .replace(/📘\s*\*\*Definition.*?\*\*:/gi, "")
        .replace(/📘\s*From.*?:/gi, "")
        .replace(/Hands-On[_\w-]*/gi, "")
        .replace(/👉.*$/gi, "")
        .replace(/Check the video tutorials below.*$/gi, "")
        .trim();
    const sentences  = cleaned.match(/[^.!?]+[.!?]+/g) || [cleaned];
    const paragraphs = [];
    for (let i = 0; i < sentences.length; i += 3) {
        const para = sentences.slice(i, i + 3).join(" ").trim();
        if (para && para.length > 20) paragraphs.push(para);
    }
    return paragraphs.length > 0 ? paragraphs : [cleaned];
}

/* =====================
   BUILD SOURCES DIV (shared)
===================== */
function buildSourcesDiv(sources) {
    const s  = document.createElement("div");
    s.className = "sources";
    const h4 = document.createElement("h4");
    h4.textContent = "Video Sources";
    s.appendChild(h4);
    sources.videos.forEach((v, i) => {
        const card = document.createElement("div");
        card.className = "video-ref";
        const cleanTitle = v.title.replace(".wav", "").replace(/^\d+[\s_-]*/, "").trim();
        // Score intentionally omitted — cosine similarity numbers are meaningless to users
        const tsLabel = v.timestamp === "0:00" ? "Watch full lecture" : `Watch from ${v.timestamp}`;
        card.innerHTML = `
            <strong>${i + 1}. ${cleanTitle}</strong><br>
            <a href="${v.url}" target="_blank" rel="noopener noreferrer">
                ▶ ${tsLabel === "Watch full lecture" ? tsLabel : `Watch from <span class="timestamp">${v.timestamp}</span>`}
            </a>`;
        s.appendChild(card);
    });
    return s;
}

/* =====================
   STREAMING BOT MESSAGE
   Creates the shell immediately with sources pre-populated.
   Returns refs so the caller can append tokens into streamP.
===================== */
function createStreamingBotMessage(sources) {
    const msg    = document.createElement("div");
    msg.className = "message";
    const bubble = document.createElement("div");
    bubble.className = "bot-message";

    const title = document.createElement("h3");
    title.textContent = "Explanation";
    bubble.appendChild(title);

    const textContainer = document.createElement("div");
    textContainer.className = "streaming-container";
    const streamP = document.createElement("p");
    streamP.className = "explanation-paragraph streaming-text";
    textContainer.appendChild(streamP);
    bubble.appendChild(textContainer);

    if (sources && sources.videos && sources.videos.length > 0) {
        bubble.appendChild(buildSourcesDiv(sources));
    }

    msg.appendChild(bubble);
    chatMessages.appendChild(msg);
    scrollToBottom();
    return { streamP, textContainer, bubble };
}

/* =====================
   FINALIZE BRIEF — show definition + Deep Dive button
===================== */
function finalizeBriefMessage(streamP, textContainer, bubble, fullText, query, historySnapshot) {
    streamP.classList.remove("streaming-text");
    textContainer.innerHTML = `<p class="explanation-paragraph brief-text">${fullText.trim()}</p>`;

    // Deep Dive button — inserted before the sources section
    const btn = document.createElement("button");
    btn.className = "deep-dive-btn";
    btn.innerHTML = "Deep Dive →";
    btn.title = "Get a full in-depth explanation (takes 30–60 seconds)";
    btn.onclick = () => expandAnswer(bubble, btn, query, historySnapshot);

    const sources = bubble.querySelector(".sources");
    sources ? bubble.insertBefore(btn, sources) : bubble.appendChild(btn);
    scrollToBottom();
}

/* =====================
   EXPAND — streams full answer into same bubble when Deep Dive clicked
===================== */
async function expandAnswer(bubble, btn, query, history) {
    btn.remove();

    // Expansion area — inserted before sources
    const expContainer = document.createElement("div");
    expContainer.className = "streaming-container expansion-container";
    const divider = document.createElement("hr");
    divider.className = "expansion-divider";
    const expP = document.createElement("p");
    expP.className = "explanation-paragraph streaming-text";
    expContainer.appendChild(divider);
    expContainer.appendChild(expP);

    const sources = bubble.querySelector(".sources");
    sources ? bubble.insertBefore(expContainer, sources) : bubble.appendChild(expContainer);
    scrollToBottom();

    let fullText = "";
    try {
        const response = await fetch("/ask/stream", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ query, history })
        });
        if (!response.ok) {
            const e = await response.text().catch(() => "");
            expP.classList.remove("streaming-text");
            expP.textContent = `⚠️ Error ${response.status}: ${e.slice(0, 150)}`;
            return;
        }

        const reader  = response.body.getReader();
        const decoder = new TextDecoder();
        let   buffer  = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();

            for (const line of lines) {
                if (!line.startsWith("data: ")) continue;
                let event;
                try { event = JSON.parse(line.slice(6)); } catch { continue; }

                if (event.type === "token") {
                    fullText += event.token;
                    expP.textContent = fullText;
                    scrollToBottom();
                } else if (event.type === "done" && fullText) {
                    // Format full answer into paragraphs
                    expP.classList.remove("streaming-text");
                    const paragraphs = formatExplanation(fullText);
                    expContainer.innerHTML = "";
                    expContainer.appendChild(divider.cloneNode());
                    paragraphs.forEach(para => {
                        const p = document.createElement("p");
                        p.className = "explanation-paragraph";
                        p.textContent = para;
                        expContainer.appendChild(p);
                    });
                    scrollToBottom();
                } else if (event.type === "error") {
                    expP.classList.remove("streaming-text");
                    expP.textContent = "⚠️ " + event.message;
                }
                // 'sources' event intentionally ignored — already shown
            }
        }
    } catch (err) {
        expP.classList.remove("streaming-text");
        expP.textContent = "⚠️ Failed to load full explanation.";
    }
}

/* =====================
   FINALIZE after streaming done (used by expandAnswer paragraph rebuild)
===================== */
function finalizeStreamingMessage(streamP, textContainer, fullText) {
    streamP.classList.remove("streaming-text");
    const paragraphs = formatExplanation(fullText);
    textContainer.innerHTML = "";
    paragraphs.forEach(para => {
        const p = document.createElement("p");
        p.className = "explanation-paragraph";
        p.textContent = para;
        textContainer.appendChild(p);
    });
}

/* =====================
   ERROR MESSAGE
===================== */
function addErrorMessage(errorText) {
    const msg    = document.createElement("div");
    msg.className = "message";
    const bubble = document.createElement("div");
    bubble.className = "bot-message error-message";
    bubble.innerHTML = `<strong>⚠️ Error:</strong> ${errorText}`;
    msg.appendChild(bubble);
    chatMessages.appendChild(msg);
    scrollToBottom();
}

/* =====================
   SEND MESSAGE — streaming via /ask/stream SSE
===================== */
async function sendMessage() {
    const query = userInput.value.trim();
    if (!query) return;

    addUserMessage(query);
    userInput.value    = "";
    userInput.disabled = true;
    typingIndicator.classList.add("active");
    _autoScroll = true;

    let refs     = null;
    let fullText = "";

    const historyPayload = conversationHistory.slice(-(MAX_HISTORY * 2));

    try {
        const response = await fetch("/ask/brief", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ query, history: historyPayload })
        });

        if (!response.ok) {
            const errBody = await response.text().catch(() => "");
            throw new Error(`Server error ${response.status}: ${errBody.slice(0, 200)}`);
        }

        const reader  = response.body.getReader();
        _activeReader = reader;
        stopBtn.classList.add("visible");
        const decoder = new TextDecoder();
        let   buffer  = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            // Buffer incoming bytes — a single read() chunk may span multiple SSE events
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();   // hold the last (possibly incomplete) line

            for (const line of lines) {
                if (!line.startsWith("data: ")) continue;
                let event;
                try { event = JSON.parse(line.slice(6)); } catch { continue; }

                if (event.type === "sources") {
                    // Sources arrive first (~100ms); hide spinner, create message shell
                    typingIndicator.classList.remove("active");
                    refs = createStreamingBotMessage(event.sources);

                } else if (event.type === "token") {
                    if (!refs) {
                        // Guard: sources event missing (shouldn't happen)
                        typingIndicator.classList.remove("active");
                        refs = createStreamingBotMessage({ videos: [] });
                    }
                    fullText += event.token;
                    refs.streamP.textContent = fullText;
                    scrollToBottom();  // throttled via rAF — never more than 60 reflows/s

                } else if (event.type === "done") {
                    if (refs && fullText) {
                        // Show definition + Deep Dive button (pass history snapshot for the button click)
                        finalizeBriefMessage(refs.streamP, refs.textContainer, refs.bubble,
                                             fullText, query, historyPayload);
                        conversationHistory.push({ role: "user",      content: query });
                        conversationHistory.push({ role: "assistant",  content: fullText.slice(0, 500) });
                    } else if (!refs) {
                        addErrorMessage("No response received. Is Ollama running?");
                    }

                } else if (event.type === "error") {
                    typingIndicator.classList.remove("active");
                    if (refs) {
                        refs.streamP.classList.remove("streaming-text");
                        refs.streamP.style.color = "var(--error, #dc2626)";
                        refs.streamP.textContent = "⚠️ " + event.message;
                    } else {
                        addErrorMessage(event.message);
                    }
                }
            }
        }
    } catch (err) {
        console.error("Streaming error:", err);
        typingIndicator.classList.remove("active");
        if (err.name !== "AbortError") {
            addErrorMessage("Failed to connect to server. Is the server running?");
        }
    } finally {
        _activeReader = null;
        stopBtn.classList.remove("visible");
        typingIndicator.classList.remove("active");
        userInput.disabled = false;
        userInput.focus();
    }
}

/* =====================
   INIT
===================== */
window.onload = () => userInput.focus();
</script>
</body>
</html>
