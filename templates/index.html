<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Teaching Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
<div class="page" id="page">

    <!-- App header — hidden until first message -->
    <header class="app-header" id="appHeader">
        <div class="header-brand">AI Teaching Assistant</div>
        <div class="header-actions">
            <button class="hdr-btn" onclick="newChat()" aria-label="Start a new conversation">New Chat</button>
        </div>
    </header>

    <!-- Empty state — centered hero, shown before any messages -->
    <div class="empty-state" id="emptyState">
        <div class="hero-text">
            <h1>AI Teaching Assistant</h1>
            <p>Machine Learning &amp; Deep Learning Tutor — ask anything below.</p>
        </div>
    </div>

    <!-- Chat messages — hidden until first message -->
    <main class="chat-messages" id="chatMessages"></main>

    <!-- Typing indicator + stop -->
    <div class="typing-indicator" id="typingIndicator">
        <span></span><span></span><span></span>
        <button class="stop-btn" id="stopBtn" onclick="stopGeneration()" aria-label="Stop generating">&#9632; Stop</button>
    </div>

    <!-- Input section — always at bottom -->
    <div class="input-section" id="inputSection">

        <!-- Glassmorphism input box -->
        <div class="input-glass">
            <textarea
                id="userInput"
                placeholder="Ask about ML/DL concepts..."
                rows="1"
                aria-label="Ask a question"
            ></textarea>
            <div class="input-footer-row">
                <span class="input-hint">Shift+Enter for new line</span>
                <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()" aria-label="Send message">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 19V5M5 12l7-7 7 7"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Quick action pills — shown in empty state only -->
        <div class="quick-actions" id="quickActions">
            <button class="qa-btn" onclick="askQuestion('What is overfitting?')">What is overfitting?</button>
            <button class="qa-btn" onclick="askQuestion('How do CNNs work?')">How do CNNs work?</button>
            <button class="qa-btn" onclick="askQuestion('What is gradient descent?')">What is gradient descent?</button>
            <button class="qa-btn" onclick="askQuestion('Explain backpropagation')">Explain backpropagation</button>
            <button class="qa-btn" onclick="askQuestion('What are RNNs?')">What are RNNs?</button>
            <button class="qa-btn" onclick="askQuestion('What is an LSTM?')">What is an LSTM?</button>
        </div>

    </div>
</div>

<script>
/* ─────────────────────────────────────────────
   ELEMENT REFS
───────────────────────────────────────────── */
const chatMessages    = document.getElementById("chatMessages");
const userInput       = document.getElementById("userInput");
const typingIndicator = document.getElementById("typingIndicator");
const stopBtn         = document.getElementById("stopBtn");
const sendBtn         = document.getElementById("sendBtn");
const emptyState      = document.getElementById("emptyState");
const appHeader       = document.getElementById("appHeader");
const inputSection    = document.getElementById("inputSection");
const quickActions    = document.getElementById("quickActions");

/* ─────────────────────────────────────────────
   TEXTAREA AUTO-RESIZE
───────────────────────────────────────────── */
const MIN_H = 48, MAX_H = 150;

function adjustInputHeight(reset) {
    if (reset) { userInput.style.height = MIN_H + "px"; return; }
    userInput.style.height = MIN_H + "px";
    userInput.style.height = Math.min(userInput.scrollHeight, MAX_H) + "px";
}

userInput.addEventListener("input", () => {
    sendBtn.disabled = !userInput.value.trim();
    adjustInputHeight();
});

userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

/* ─────────────────────────────────────────────
   CHAT MODE TRANSITIONS
   Empty state  ↔  Chat state
───────────────────────────────────────────── */
let _inChatMode = false;

function enterChatMode() {
    if (_inChatMode) return;
    _inChatMode = true;
    emptyState.style.display      = "none";
    appHeader.style.display       = "flex";
    chatMessages.classList.add("visible");
    quickActions.style.display    = "none";
    inputSection.classList.add("chat-mode");
}

function exitChatMode() {
    _inChatMode = false;
    emptyState.style.display      = "flex";
    appHeader.style.display       = "none";
    chatMessages.classList.remove("visible");
    quickActions.style.display    = "flex";
    inputSection.classList.remove("chat-mode");
}

/* ─────────────────────────────────────────────
   STOP GENERATION
───────────────────────────────────────────── */
let _activeReader = null;

function stopGeneration() {
    if (_activeReader) { _activeReader.cancel(); _activeReader = null; }
    stopBtn.classList.remove("visible");
}

/* ─────────────────────────────────────────────
   CONVERSATION HISTORY
───────────────────────────────────────────── */
let conversationHistory = [];
const MAX_HISTORY = 3;

function newChat() {
    conversationHistory = [];
    chatMessages.innerHTML = "";
    exitChatMode();
    userInput.value = "";
    adjustInputHeight(true);
    sendBtn.disabled = true;
    userInput.focus();
}

function askQuestion(q) { userInput.value = q; sendBtn.disabled = false; sendMessage(); }

/* ─────────────────────────────────────────────
   SCROLL MANAGEMENT
───────────────────────────────────────────── */
let _autoScroll = true, _rafPending = false;

chatMessages.addEventListener("scroll", () => {
    const d = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
    _autoScroll = d < 80;
}, { passive: true });

function scrollToBottom() {
    if (!_autoScroll || _rafPending) return;
    _rafPending = true;
    requestAnimationFrame(() => {
        _rafPending = false;
        if (_autoScroll) chatMessages.scrollTop = chatMessages.scrollHeight;
    });
}

/* ─────────────────────────────────────────────
   USER MESSAGE
───────────────────────────────────────────── */
function addUserMessage(text) {
    const msg    = document.createElement("div");  msg.className = "message";
    const bubble = document.createElement("div");  bubble.className = "user-bubble";
    bubble.textContent = text;
    msg.appendChild(bubble);
    chatMessages.appendChild(msg);
    scrollToBottom();
}

/* ─────────────────────────────────────────────
   FORMAT EXPLANATION TEXT
───────────────────────────────────────────── */
function formatExplanation(text) {
    let cleaned = text
        .replace(/📘\s*\*\*From.*?\*\*:/gi, "").replace(/📘\s*From.*?:/gi, "")
        .replace(/Hands-On[_\w-]*/gi, "").replace(/👉.*$/gi, "")
        .replace(/Check the video tutorials below.*$/gi, "").trim();
    const sentences  = cleaned.match(/[^.!?]+[.!?]+/g) || [cleaned];
    const paragraphs = [];
    for (let i = 0; i < sentences.length; i += 3) {
        const para = sentences.slice(i, i + 3).join(" ").trim();
        if (para && para.length > 20) paragraphs.push(para);
    }
    return paragraphs.length > 0 ? paragraphs : [cleaned];
}

/* ─────────────────────────────────────────────
   BUILD VIDEO SOURCES
───────────────────────────────────────────── */
function buildSourcesDiv(sources) {
    const s  = document.createElement("div");   s.className = "sources";
    const h4 = document.createElement("h4");    h4.textContent = "Video Sources";
    s.appendChild(h4);
    sources.videos.forEach((v, i) => {
        const card      = document.createElement("div"); card.className = "video-ref";
        const cleanTitle = v.title.replace(".wav", "").replace(/^\d+[\s_-]*/, "").trim();
        const tsLabel   = v.timestamp === "0:00" ? "Watch full lecture" : `Watch from <span class="timestamp">${v.timestamp}</span>`;
        card.innerHTML = `<strong>${i + 1}. ${cleanTitle}</strong><br>
            <a href="${v.url}" target="_blank" rel="noopener noreferrer">▶ ${tsLabel}</a>`;
        s.appendChild(card);
    });
    return s;
}

/* ─────────────────────────────────────────────
   STREAMING BOT MESSAGE SHELL
───────────────────────────────────────────── */
function createStreamingBotMessage(sources) {
    const msg    = document.createElement("div");  msg.className = "message";
    const bubble = document.createElement("div");  bubble.className = "bot-bubble";

    const label = document.createElement("h3");   label.textContent = "Explanation";
    bubble.appendChild(label);

    const textContainer = document.createElement("div");  textContainer.className = "stream-wrap";
    const streamP       = document.createElement("p");    streamP.className = "exp-p streaming-text";
    textContainer.appendChild(streamP);
    bubble.appendChild(textContainer);

    if (sources && sources.videos && sources.videos.length > 0)
        bubble.appendChild(buildSourcesDiv(sources));

    msg.appendChild(bubble);
    chatMessages.appendChild(msg);
    scrollToBottom();
    return { streamP, textContainer, bubble };
}

/* ─────────────────────────────────────────────
   FINALIZE BRIEF — definition + Deep Dive button
───────────────────────────────────────────── */
function finalizeBriefMessage(streamP, textContainer, bubble, fullText, query, historySnapshot) {
    streamP.classList.remove("streaming-text");
    textContainer.innerHTML = `<p class="exp-p">${fullText.trim()}</p>`;

    const btn   = document.createElement("button");
    btn.className = "deep-dive-btn";
    btn.textContent = "Deep Dive →";
    btn.title   = "Full in-depth explanation (30–60 s)";
    btn.onclick = () => expandAnswer(bubble, btn, query, historySnapshot);

    const srcEl = bubble.querySelector(".sources");
    srcEl ? bubble.insertBefore(btn, srcEl) : bubble.appendChild(btn);
    scrollToBottom();
}

/* ─────────────────────────────────────────────
   EXPAND — streams full answer into same bubble
───────────────────────────────────────────── */
async function expandAnswer(bubble, btn, query, history) {
    btn.remove();

    const expWrap = document.createElement("div");  expWrap.className = "stream-wrap";
    const divider = document.createElement("hr");   divider.className = "exp-divider";
    const expP    = document.createElement("p");    expP.className = "exp-p streaming-text";
    expWrap.appendChild(divider);
    expWrap.appendChild(expP);

    const srcEl = bubble.querySelector(".sources");
    srcEl ? bubble.insertBefore(expWrap, srcEl) : bubble.appendChild(expWrap);
    scrollToBottom();

    let fullText = "";
    try {
        const response = await fetch("/ask/stream", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ query, history })
        });
        if (!response.ok) {
            expP.classList.remove("streaming-text");
            expP.textContent = "⚠️ Error " + response.status; return;
        }

        const reader  = response.body.getReader();
        const decoder = new TextDecoder();
        let   buffer  = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n"); buffer = lines.pop();

            for (const line of lines) {
                if (!line.startsWith("data: ")) continue;
                let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }

                if (ev.type === "token") {
                    fullText += ev.token; expP.textContent = fullText; scrollToBottom();
                } else if (ev.type === "done" && fullText) {
                    expP.classList.remove("streaming-text");
                    const paras = formatExplanation(fullText);
                    expWrap.innerHTML = "";
                    expWrap.appendChild(divider.cloneNode());
                    paras.forEach(para => {
                        const p = document.createElement("p"); p.className = "exp-p";
                        p.textContent = para; expWrap.appendChild(p);
                    });
                    scrollToBottom();
                } else if (ev.type === "error") {
                    expP.classList.remove("streaming-text"); expP.textContent = "⚠️ " + ev.message;
                }
            }
        }
    } catch { expP.classList.remove("streaming-text"); expP.textContent = "⚠️ Failed to load."; }
}

function finalizeStreamingMessage(streamP, textContainer, fullText) {
    streamP.classList.remove("streaming-text");
    const paras = formatExplanation(fullText);
    textContainer.innerHTML = "";
    paras.forEach(para => {
        const p = document.createElement("p"); p.className = "exp-p";
        p.textContent = para; textContainer.appendChild(p);
    });
}

/* ─────────────────────────────────────────────
   ERROR MESSAGE
───────────────────────────────────────────── */
function addErrorMessage(text) {
    const msg    = document.createElement("div");  msg.className = "message";
    const bubble = document.createElement("div");  bubble.className = "bot-bubble error-bubble";
    bubble.innerHTML = `<strong>Error:</strong> ${text}`;
    msg.appendChild(bubble); chatMessages.appendChild(msg); scrollToBottom();
}

/* ─────────────────────────────────────────────
   SEND MESSAGE
───────────────────────────────────────────── */
async function sendMessage() {
    const query = userInput.value.trim();
    if (!query) return;

    enterChatMode();
    addUserMessage(query);
    userInput.value  = "";
    adjustInputHeight(true);
    sendBtn.disabled = true;
    typingIndicator.classList.add("active");
    _autoScroll = true;

    let refs = null, fullText = "";
    const historyPayload = conversationHistory.slice(-(MAX_HISTORY * 2));

    try {
        const response = await fetch("/ask/brief", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ query, history: historyPayload })
        });

        if (!response.ok) {
            const err = await response.text().catch(() => "");
            throw new Error(`Server error ${response.status}: ${err.slice(0, 200)}`);
        }

        const reader  = response.body.getReader();
        _activeReader = reader;
        stopBtn.classList.add("visible");
        const decoder = new TextDecoder();
        let   buffer  = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n"); buffer = lines.pop();

            for (const line of lines) {
                if (!line.startsWith("data: ")) continue;
                let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }

                if (ev.type === "sources") {
                    typingIndicator.classList.remove("active");
                    refs = createStreamingBotMessage(ev.sources);

                } else if (ev.type === "token") {
                    if (!refs) { typingIndicator.classList.remove("active"); refs = createStreamingBotMessage({ videos: [] }); }
                    fullText += ev.token;
                    refs.streamP.textContent = fullText;
                    scrollToBottom();

                } else if (ev.type === "done") {
                    if (refs && fullText) {
                        finalizeBriefMessage(refs.streamP, refs.textContainer, refs.bubble, fullText, query, historyPayload);
                        conversationHistory.push({ role: "user",      content: query });
                        conversationHistory.push({ role: "assistant", content: fullText.slice(0, 500) });
                    } else if (!refs) {
                        addErrorMessage("No response received. Is Ollama running?");
                    }

                } else if (ev.type === "error") {
                    typingIndicator.classList.remove("active");
                    if (refs) { refs.streamP.classList.remove("streaming-text"); refs.streamP.textContent = "⚠️ " + ev.message; }
                    else      { addErrorMessage(ev.message); }
                }
            }
        }
    } catch (err) {
        typingIndicator.classList.remove("active");
        if (err.name !== "AbortError") addErrorMessage("Failed to connect. Is the server running?");
    } finally {
        _activeReader = null;
        stopBtn.classList.remove("visible");
        typingIndicator.classList.remove("active");
        userInput.disabled = false;
        userInput.focus();
    }
}

window.onload = () => { adjustInputHeight(true); userInput.focus(); };
</script>
</body>
</html>
