<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Teaching Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
<div class="chat-container">

    <!-- HEADER -->
    <header class="chat-header">
        <div>
            <h1>🤖 AI Teaching Assistant</h1>
            <p>Machine Learning & Deep Learning Tutor</p>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 / ☀️</button>
    </header>

    <!-- CHAT -->
    <main class="chat-messages" id="chatMessages">
        <div class="example-questions">
            <p>💡 Suggested Questions</p>
            <span onclick="askQuestion('What is overfitting in machine learning?')">What is overfitting?</span>
            <span onclick="askQuestion('How do CNNs work?')">How do CNNs work?</span>
            <span onclick="askQuestion('What is gradient descent?')">What is gradient descent?</span>
            <span onclick="askQuestion('Explain backpropagation')">Explain backpropagation</span>
            <span onclick="askQuestion('What are RNNs?')">What are RNNs?</span>
            <span onclick="askQuestion('What is an LSTM?')">What is an LSTM?</span>
        </div>
    </main>

    <!-- TYPING INDICATOR -->
    <div class="typing-indicator" id="typingIndicator">
        <span></span><span></span><span></span>
    </div>

    <!-- INPUT -->
    <footer class="chat-input-container">
        <input
            id="userInput"
            class="chat-input"
            placeholder="Ask about ML/DL concepts..."
            onkeypress="handleKeyPress(event)"
        >
        <button class="send-button" onclick="sendMessage()">Send ✈️</button>
    </footer>

</div>

<script>
const chatMessages = document.getElementById("chatMessages");
const userInput    = document.getElementById("userInput");
const typingIndicator = document.getElementById("typingIndicator");

/* =====================
   THEME (PERSISTENT)
===================== */
function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
    html.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
}
(function initTheme() {
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
})();

/* =====================
   INPUT HANDLING
===================== */
function handleKeyPress(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function askQuestion(q) { userInput.value = q; sendMessage(); }

/* =====================
   USER MESSAGE
===================== */
function addUserMessage(text) {
    const msg    = document.createElement("div");
    msg.className = "message";
    const bubble = document.createElement("div");
    bubble.className = "user-message";
    bubble.textContent = text;
    msg.appendChild(bubble);
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

/* =====================
   FORMAT TEXT
===================== */
function formatExplanation(text) {
    let cleaned = text
        .replace(/📘\s*\*\*From.*?\*\*:/gi, "")
        .replace(/📘\s*\*\*Definition.*?\*\*:/gi, "")
        .replace(/📘\s*From.*?:/gi, "")
        .replace(/Hands-On[_\w-]*/gi, "")
        .replace(/👉.*$/gi, "")
        .replace(/Check the video tutorials below.*$/gi, "")
        .trim();
    const sentences  = cleaned.match(/[^.!?]+[.!?]+/g) || [cleaned];
    const paragraphs = [];
    for (let i = 0; i < sentences.length; i += 3) {
        const para = sentences.slice(i, i + 3).join(" ").trim();
        if (para && para.length > 20) paragraphs.push(para);
    }
    return paragraphs.length > 0 ? paragraphs : [cleaned];
}

/* =====================
   BUILD SOURCES DIV (shared)
===================== */
function buildSourcesDiv(sources) {
    const s  = document.createElement("div");
    s.className = "sources";
    const h4 = document.createElement("h4");
    h4.innerHTML = "🎥 Video Tutorials";
    s.appendChild(h4);
    sources.videos.forEach((v, i) => {
        const card = document.createElement("div");
        card.className = "video-ref";
        const cleanTitle = v.title.replace(".wav", "").replace(/^\d+[\s_-]*/, "").trim();
        card.innerHTML = `
            <strong>${i + 1}. ${cleanTitle}</strong>
            <span class="score">⭐ ${v.score}</span><br>
            <a href="${v.url}" target="_blank" rel="noopener noreferrer">
                ▶️ Watch from <span class="timestamp">${v.timestamp}</span>
            </a>`;
        s.appendChild(card);
    });
    return s;
}

/* =====================
   STREAMING BOT MESSAGE
   Creates the shell immediately with sources pre-populated.
   Returns refs so the caller can append tokens into streamP.
===================== */
function createStreamingBotMessage(sources) {
    const msg    = document.createElement("div");
    msg.className = "message";
    const bubble = document.createElement("div");
    bubble.className = "bot-message";

    const title = document.createElement("h3");
    title.innerHTML = "📘 Explanation";
    bubble.appendChild(title);

    // Text container — tokens stream into streamP, then get replaced on done
    const textContainer = document.createElement("div");
    textContainer.className = "streaming-container";
    const streamP = document.createElement("p");
    streamP.className = "explanation-paragraph streaming-text";
    textContainer.appendChild(streamP);
    bubble.appendChild(textContainer);

    if (sources && sources.videos && sources.videos.length > 0) {
        bubble.appendChild(buildSourcesDiv(sources));
    }

    msg.appendChild(bubble);
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return { streamP, textContainer };
}

/* =====================
   FINALIZE after streaming done
   Replace the single streaming <p> with properly formatted paragraphs.
===================== */
function finalizeStreamingMessage(streamP, textContainer, fullText) {
    streamP.classList.remove("streaming-text");
    const paragraphs = formatExplanation(fullText);
    textContainer.innerHTML = "";
    paragraphs.forEach(para => {
        const p = document.createElement("p");
        p.className = "explanation-paragraph";
        p.textContent = para;
        textContainer.appendChild(p);
    });
}

/* =====================
   ERROR MESSAGE
===================== */
function addErrorMessage(errorText) {
    const msg    = document.createElement("div");
    msg.className = "message";
    const bubble = document.createElement("div");
    bubble.className = "bot-message error-message";
    bubble.innerHTML = `<strong>⚠️ Error:</strong> ${errorText}`;
    msg.appendChild(bubble);
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

/* =====================
   SEND MESSAGE — streaming via /ask/stream SSE
===================== */
async function sendMessage() {
    const query = userInput.value.trim();
    if (!query) return;

    addUserMessage(query);
    userInput.value    = "";
    userInput.disabled = true;
    typingIndicator.classList.add("active");

    let refs     = null;   // { streamP, textContainer }
    let fullText = "";

    try {
        const response = await fetch("/ask/stream", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ query })
        });

        if (!response.ok) throw new Error(`Server error: ${response.status}`);

        const reader  = response.body.getReader();
        const decoder = new TextDecoder();
        let   buffer  = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            // Buffer incoming bytes — a single read() chunk may span multiple SSE events
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();   // hold the last (possibly incomplete) line

            for (const line of lines) {
                if (!line.startsWith("data: ")) continue;
                let event;
                try { event = JSON.parse(line.slice(6)); } catch { continue; }

                if (event.type === "sources") {
                    // Sources arrive first (~100ms); hide spinner, create message shell
                    typingIndicator.classList.remove("active");
                    refs = createStreamingBotMessage(event.sources);

                } else if (event.type === "token") {
                    if (!refs) {
                        // Guard: sources event missing (shouldn't happen)
                        typingIndicator.classList.remove("active");
                        refs = createStreamingBotMessage({ videos: [] });
                    }
                    fullText += event.token;
                    refs.streamP.textContent = fullText;
                    chatMessages.scrollTop = chatMessages.scrollHeight;

                } else if (event.type === "done") {
                    if (refs && fullText) {
                        finalizeStreamingMessage(refs.streamP, refs.textContainer, fullText);
                    } else if (!refs) {
                        addErrorMessage("No response received. Is Ollama running?");
                    }

                } else if (event.type === "error") {
                    typingIndicator.classList.remove("active");
                    if (refs) {
                        refs.streamP.classList.remove("streaming-text");
                        refs.streamP.style.color = "var(--error, #dc2626)";
                        refs.streamP.textContent = "⚠️ " + event.message;
                    } else {
                        addErrorMessage(event.message);
                    }
                }
            }
        }
    } catch (err) {
        console.error("Streaming error:", err);
        typingIndicator.classList.remove("active");
        addErrorMessage("Failed to connect to server. Is the server running?");
    } finally {
        typingIndicator.classList.remove("active");
        userInput.disabled = false;
        userInput.focus();
    }
}

/* =====================
   INIT
===================== */
window.onload = () => userInput.focus();
</script>
</body>
</html>
