services:
  - type: web
    name: rag-ai-teaching
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: standard          # 2 GB RAM — needed for sentence-transformers + FAISS

    envVars:
      # ── Required: set these in the Render dashboard ──────────────────────
      - key: GROQ_API_KEY          # Groq API key  (console.groq.com)
        sync: false
      - key: S3_BUCKET             # S3 bucket name holding model files
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # ── Optional overrides ────────────────────────────────────────────────
      - key: AWS_DEFAULT_REGION
        value: ap-south-1          # change to your bucket's region
      - key: S3_INDEX_KEY
        value: models/faiss_with_titles.index
      - key: S3_META_KEY
        value: models/faiss_metadata_clean.json

      # ── Cloud mode flags ──────────────────────────────────────────────────
      - key: USE_LOCAL_EMBED
        value: "true"              # use sentence-transformers, not Ollama
      - key: RENDER
        value: "true"              # tells main.py to bind 0.0.0.0
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
